name: Container Security Scan

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

jobs:
  check-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build API image
        run: docker build --target=runtime -t video-analysis-api ./api

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: video-analysis-api
          severity: HIGH,CRITICAL
          exit-code: 1

  check-nginx:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build nginx image
        run: docker build -f ./infra/nginx/Dockerfile.prod -t video-analysis-nginx .

      - name: Scan nginx image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: video-analysis-nginx
          severity: HIGH,CRITICAL
          exit-code: 1

  check-worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build worker image
        run: docker build -t video-analysis-worker ./worker

      - name: Scan worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: video-analysis-worker
          severity: HIGH,CRITICAL
          exit-code: 1