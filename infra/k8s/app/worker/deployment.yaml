apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: sgawalsh/video-analysis-worker:latest
          ports:
            - name: metrics
              containerPort: 2112
          env:
            - name: role
              value: worker
            - name: worker_concurrency
              value: "3"
          envFrom:
            - configMapRef:
                name: postgres-config
            - configMapRef:
                name: worker-config
            - secretRef:
                name: postgres-secret
