apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-sidecar
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-sidecar
  template:
    metadata:
      labels:
        app: llm-sidecar
    spec:
      containers:
      - name: llm-model
        image: sgawalsh/video-analysis-llm-model:latest

        ports:
        - containerPort: 11434

        resources:
          requests:
            cpu: 2
            memory: 4Gi

          limits:
              cpu: 4
              memory: 8Gi
        startupProbe:
          httpGet:
            path: /
            port: 11434
          periodSeconds: 5
          failureThreshold: 30

        readinessProbe:
          httpGet:
            path: /
            port: 11434
          periodSeconds: 5
      - name: llm-worker
        image: sgawalsh/video-analysis-worker:latest
        ports:
          - name: metrics
            containerPort: 2112
        envFrom:
          - configMapRef:
              name: postgres-config
          - configMapRef:
              name: llm-worker-config
          - secretRef:
              name: postgres-secret