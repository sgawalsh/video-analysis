apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: llm-model-worker-scaledobject
  namespace: app
spec:
  scaleTargetRef:
    name: llm-model-worker

  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 10
  cooldownPeriod: 30

  triggers:
    - type: postgresql
      metadata:
        host: postgres.app.svc.cluster.local
        port: "5432"
        dbName: jobs
        sslmode: disable
        query: "SELECT COUNT(*) FROM jobs WHERE status IN ('PENDING', 'RUNNING') AND type IN ('TOPIC_DETECTION_LLM', 'VIDEO_SUMMARIZATION_LLM');"
        targetQueryValue: "1"
      authenticationRef:
        name: postgres-trigger-auth