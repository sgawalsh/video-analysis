apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaledobject
  namespace: app
spec:
  scaleTargetRef:
    name: worker

  minReplicaCount: 2
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 300

  triggers:
    - type: postgresql
      metadata:
        host: postgres.app.svc.cluster.local
        port: "5432"
        dbName: jobs
        sslmode: disable
        query: "SELECT COUNT(*) FROM jobs WHERE status IN ('PENDING', 'RUNNING') AND type IN ('KEYWORD_SEARCH', 'SEMANTIC_SEARCH', 'TOPIC_DETECTION_EMBED', 'VIDEO_SUMMARIZATION_TRANSCRIBE');"
        targetQueryValue: "5"
      authenticationRef:
        name: postgres-trigger-auth